<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Geometric Logic Puzzle</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "outline": "#8f6f6e",
                      "on-error": "#ffffff",
                      "surface-container": "#edeeef",
                      "error": "#ba1a1a",
                      "surface-variant": "#e1e3e4",
                      "inverse-primary": "#ffb3b1",
                      "primary-container": "#db313f",
                      "outline-variant": "#e4bebc",
                      "on-tertiary-fixed": "#001f2a",
                      "on-primary-container": "#fffbff",
                      "surface-container-low": "#f3f4f5",
                      "surface-dim": "#d9dadb",
                      "tertiary-fixed-dim": "#73d2fd",
                      "on-primary-fixed": "#410007",
                      "surface-container-high": "#e7e8e9",
                      "tertiary-fixed": "#bfe8ff",
                      "tertiary-container": "#007ea4",
                      "inverse-on-surface": "#f0f1f2",
                      "primary-fixed-dim": "#ffb3b1",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed-variant": "#5b4300",
                      "secondary-fixed": "#ffdf9b",
                      "on-secondary": "#ffffff",
                      "primary": "#b7102a",
                      "tertiary": "#006482",
                      "on-tertiary-fixed-variant": "#004d65",
                      "secondary": "#785a00",
                      "background": "#f8f9fa",
                      "surface": "#f8f9fa",
                      "on-tertiary": "#ffffff",
                      "on-error-container": "#93000a",
                      "inverse-surface": "#2e3132",
                      "on-tertiary-container": "#fbfdff",
                      "error-container": "#ffdad6",
                      "secondary-container": "#ffd167",
                      "on-surface": "#191c1d",
                      "surface-container-highest": "#e1e3e4",
                      "secondary-fixed-dim": "#edc157",
                      "on-surface-variant": "#5b403f",
                      "on-background": "#191c1d",
                      "on-secondary-fixed": "#251a00",
                      "surface-tint": "#bb152c",
                      "surface-bright": "#f8f9fa",
                      "on-primary": "#ffffff",
                      "primary-fixed": "#ffdad8",
                      "on-primary-fixed-variant": "#92001c",
                      "on-secondary-container": "#765900"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "grid-margin": "24px",
                      "sm": "8px",
                      "xl": "48px",
                      "md": "16px",
                      "lg": "24px",
                      "border-width": "2px",
                      "xs": "4px",
                      "xxl": "96px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "body-lg": ["Archivo Narrow"],
                      "label-sm": ["JetBrains Mono"],
                      "label-md": ["JetBrains Mono"],
                      "headline-md": ["Archivo Narrow"],
                      "headline-xl": ["Archivo Narrow"],
                      "headline-lg": ["Archivo Narrow"],
                      "body-md": ["Archivo Narrow"],
                      "headline-lg-mobile": ["Archivo Narrow"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "1.4", "fontWeight": "500"}],
                      "label-md": ["14px", {"lineHeight": "1.4", "fontWeight": "500"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "headline-xl": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}]
              }
      },
          },
        }
      </script>
<style>
        .ink-border { border-color: #191c1d; }
        .shape-circle { border-radius: 50%; }
        .shape-square { border-radius: 0; }
        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 34.6px solid currentColor;
            background-color: transparent !important;
        }
        .shape-triangle-sm {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 17.3px solid currentColor;
            background-color: transparent !important;
        }
        /* Hide scrollbar for clue tray */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-20">
<!-- TopAppBar -->
<header class="w-full top-0 bg-background dark:bg-background border-b-2 border-outline dark:border-outline-variant flex justify-between items-center px-grid-margin h-16 z-10 sticky">
<button class="p-2 hover:bg-secondary-container dark:hover:bg-secondary-fixed transition-colors duration-100 active:bg-primary active:text-on-primary rounded-none">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">grid_view</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed uppercase tracking-tighter">
            GEOMETRIC LOGIC
        </h1>
<button class="p-2 hover:bg-secondary-container dark:hover:bg-secondary-fixed transition-colors duration-100 active:bg-primary active:text-on-primary rounded-none">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">settings</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center justify-start p-grid-margin gap-lg max-w-2xl mx-auto w-full">
<!-- Game Grid (3x3) -->
<div class="w-full max-w-[400px] overflow-x-auto no-scrollbar flex gap-sm pb-sm">
<!-- Clue A: 2x2 grid -->
<div class="flex-shrink-0 border-2 ink-border bg-background flex flex-col">
<div class="bg-primary text-on-primary font-label-sm text-label-sm uppercase px-2 py-1 border-b-2 ink-border">Clue A</div>
<div class="flex-grow p-2 flex items-center justify-center">
<div class="grid grid-cols-2 grid-rows-2 border-2 ink-border w-16 h-16 bg-surface-container-highest">
<div class="border-[1px] ink-border bg-background flex items-center justify-center">
<div class="w-4 h-4 shape-circle bg-primary border-[1px] ink-border"></div>
</div>
<div class="border-[1px] ink-border bg-background"></div>
<div class="border-[1px] ink-border bg-background"></div>
<div class="border-[1px] ink-border bg-background flex items-center justify-center">
<div class="w-4 h-4 shape-square bg-tertiary-container border-[1px] ink-border"></div>
</div>
</div>
</div>
</div>
<!-- Clue B: 1x3 column -->
<div class="flex-shrink-0 border-2 ink-border bg-background flex flex-col">
<div class="bg-secondary-container text-on-secondary-container font-label-sm text-label-sm uppercase px-2 py-1 border-b-2 ink-border">Clue B</div>
<div class="flex-grow p-2 flex items-center justify-center">
<div class="grid grid-cols-1 grid-rows-3 border-2 ink-border w-8 h-20 bg-surface-container-highest">
<div class="border-[1px] ink-border bg-background flex items-center justify-center">
<div class="w-4 h-4 bg-tertiary-container"></div>
</div>
<div class="border-[1px] ink-border bg-background flex items-center justify-center">
<div class="w-4 h-4 border-[1px] ink-border border-dashed"></div>
</div>
<div class="border-[1px] ink-border bg-background flex items-center justify-center">
<div class="w-4 h-4 bg-tertiary-container"></div>
</div>
</div>
</div>
</div>
<!-- Clue C: 2x1 row -->
<div class="flex-shrink-0 border-2 ink-border bg-background flex flex-col">
<div class="bg-tertiary-container text-on-tertiary-container font-label-sm text-label-sm uppercase px-2 py-1 border-b-2 ink-border">Clue C</div>
<div class="flex-grow p-2 flex items-center justify-center">
<div class="grid grid-cols-2 grid-rows-1 border-2 ink-border w-16 h-8 bg-surface-container-highest">
<div class="border-[1px] ink-border bg-background flex items-center justify-center">
<div class="shape-triangle-sm text-on-surface"></div>
</div>
<div class="border-[1px] ink-border bg-background flex items-center justify-center">
<div class="w-4 h-4 bg-secondary-container"></div>
</div>
</div>
</div>
</div>
</div><div class="w-full aspect-square max-w-[400px] border-[4px] ink-border grid grid-cols-3 grid-rows-3 bg-surface-container-highest">
<!-- Row 1 -->
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)"></div>
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)">
<div class="w-12 h-12 bg-primary shape-circle border-2 ink-border"></div>
</div>
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)"></div>
<!-- Row 2 -->
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)"></div>
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)"></div>
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)">
<div class="w-12 h-12 bg-secondary-container shape-square border-2 ink-border"></div>
</div>
<!-- Row 3 -->
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)">
<div class="shape-triangle text-tertiary-container"></div>
</div>
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)"></div>
<div class="border-[2px] ink-border flex items-center justify-center bg-background cursor-pointer hover:bg-secondary-container transition-colors" onclick="placePiece(this)"></div>
</div>
<!-- Selection Tray -->
<div class="w-full max-w-[400px] border-[4px] ink-border p-md bg-surface-container">
<div class="grid grid-cols-5 gap-2">
<!-- Row 1: 5 items -->
<button class="w-full aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-primary', 'circle')">
<div class="w-8 h-8 shape-circle bg-primary border-2 ink-border"></div>
</button>
<button class="w-full aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-primary', 'square')">
<div class="w-8 h-8 shape-square bg-primary border-2 ink-border"></div>
</button>
<button class="w-full aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-primary', 'triangle')">
<div class="shape-triangle text-primary scale-75 origin-top mt-1"></div>
</button>
<button class="w-full aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-tertiary-container', 'circle')">
<div class="w-8 h-8 shape-circle bg-tertiary-container border-2 ink-border"></div>
</button>
<button class="w-full aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-tertiary-container', 'square')">
<div class="w-8 h-8 shape-square bg-tertiary-container border-2 ink-border"></div>
</button>
<!-- Row 2: 4 items (shifted/centered by empty grid slot or column layout) -->
<div class="flex col-span-5 justify-center gap-2">
<button class="w-[calc(20%-8px)] aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-tertiary-container', 'triangle')">
<div class="shape-triangle text-tertiary-container scale-75 origin-top mt-1"></div>
</button>
<button class="w-[calc(20%-8px)] aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-secondary-container', 'circle')">
<div class="w-8 h-8 shape-circle bg-secondary-container border-2 ink-border"></div>
</button>
<button class="w-[calc(20%-8px)] aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-secondary-container', 'square')">
<div class="w-8 h-8 shape-square bg-secondary-container border-2 ink-border"></div>
</button>
<button class="w-[calc(20%-8px)] aspect-square flex items-center justify-center border-2 ink-border bg-background hover:bg-surface-variant active:scale-95 transition-all" onclick="selectPiece('bg-secondary-container', 'triangle')">
<div class="shape-triangle text-secondary-container scale-75 origin-top mt-1"></div>
</button>
</div>
</div>
</div>
<!-- Clues -->
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-stretch h-20 bg-background dark:bg-background border-t-2 border-outline dark:border-outline-variant z-50">
<button class="flex flex-col items-center justify-center bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container p-sm flex-1 hover:bg-secondary-fixed dark:hover:bg-on-secondary-fixed-variant active:scale-95 transition-transform rounded-none border-r-2 border-outline">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 1;">extension</span>
<span class="font-label-md text-label-md mt-1 uppercase">PUZZLES</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface dark:text-on-surface-variant p-sm flex-1 hover:bg-secondary-fixed dark:hover:bg-on-secondary-fixed-variant active:scale-95 transition-transform rounded-none border-r-2 border-outline">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 1;">lightbulb</span>
<span class="font-label-md text-label-md mt-1 uppercase">HINT</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface dark:text-on-surface-variant p-sm flex-1 hover:bg-secondary-fixed dark:hover:bg-on-secondary-fixed-variant active:scale-95 transition-transform rounded-none border-r-2 border-outline">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 1;">undo</span>
<span class="font-label-md text-label-md mt-1 uppercase">UNDO</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface dark:text-on-surface-variant p-sm flex-1 hover:bg-secondary-fixed dark:hover:bg-on-secondary-fixed-variant active:scale-95 transition-transform rounded-none">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 1;">refresh</span>
<span class="font-label-md text-label-md mt-1 uppercase">RESET</span>
</button>
</nav>
<script>
        let currentColor = 'bg-primary';
        let currentShape = 'circle';

        function selectPiece(colorClass, shape) {
            currentColor = colorClass;
            currentShape = shape;
        }

        function placePiece(cell) {
            // Clear cell
            cell.innerHTML = '';
            
            const piece = document.createElement('div');
            
            if(currentShape === 'triangle') {
                piece.className = `shape-triangle text-${currentColor.replace('bg-', '')}`;
            } else {
                piece.className = `w-12 h-12 shape-${currentShape} ${currentColor} border-2 ink-border`;
            }
            
            cell.appendChild(piece);
        }
    </script>
</body></html>
