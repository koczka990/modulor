<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Geometry Logic - Levels</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#5b403f",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "surface-tint": "#bb152c",
                        "on-secondary-fixed": "#251a00",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e1e3e4",
                        "primary-fixed-dim": "#ffb3b1",
                        "on-primary-fixed": "#410007",
                        "secondary-fixed": "#ffdf9b",
                        "secondary-fixed-dim": "#edc157",
                        "surface": "#f8f9fa",
                        "secondary-container": "#ffd167",
                        "on-secondary-container": "#765900",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#007ea4",
                        "tertiary-fixed-dim": "#73d2fd",
                        "surface-dim": "#d9dadb",
                        "surface-container-highest": "#e1e3e4",
                        "primary-fixed": "#ffdad8",
                        "on-background": "#191c1d",
                        "on-primary-fixed-variant": "#92001c",
                        "on-error-container": "#93000a",
                        "background": "#f8f9fa",
                        "secondary": "#785a00",
                        "tertiary-fixed": "#bfe8ff",
                        "primary": "#b7102a",
                        "outline-variant": "#e4bebc",
                        "tertiary": "#006482",
                        "inverse-on-surface": "#f0f1f2",
                        "primary-container": "#db313f",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#fbfdff",
                        "inverse-surface": "#2e3132",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "inverse-primary": "#ffb3b1",
                        "on-tertiary-fixed-variant": "#004d65",
                        "surface-container": "#edeeef",
                        "surface-container-high": "#e7e8e9",
                        "on-secondary-fixed-variant": "#5b4300",
                        "surface-bright": "#f8f9fa",
                        "outline": "#8f6f6e",
                        "on-surface": "#191c1d",
                        "surface-container-low": "#f3f4f5",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#001f2a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "48px",
                        "xxl": "96px",
                        "sm": "8px",
                        "grid-margin": "24px",
                        "xs": "4px",
                        "unit": "4px",
                        "lg": "24px",
                        "border-width": "2px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Archivo Narrow"],
                        "headline-lg": ["Archivo Narrow"],
                        "label-md": ["JetBrains Mono"],
                        "headline-md": ["Archivo Narrow"],
                        "body-lg": ["Archivo Narrow"],
                        "headline-xl": ["Archivo Narrow"],
                        "label-sm": ["JetBrains Mono"],
                        "body-md": ["Archivo Narrow"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "headline-lg": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-xl": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.surface-variant');
            border-left: 2px solid theme('colors.on-surface');
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.on-surface');
        }
        /* Bauhaus Grid lines */
        .bauhaus-grid {
            background-image: 
                linear-gradient(to right, theme('colors.surface-variant') 1px, transparent 1px),
                linear-gradient(to bottom, theme('colors.surface-variant') 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen bauhaus-grid">
<!-- TopAppBar Component -->
<header class="bg-surface dark:bg-inverse-surface border-b-2 border-on-surface-variant dark:border-on-surface flex justify-between items-center w-full px-grid-margin h-16 sticky top-0 z-40">
<button class="text-primary dark:text-inverse-primary hover:bg-secondary dark:hover:bg-secondary-container transition-colors duration-200 p-sm border-2 border-transparent hover:border-on-surface scale-95 active:bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold uppercase tracking-tighter text-primary dark:text-inverse-primary">GEOMETRY LOGIC</h1>
<button class="text-primary dark:text-inverse-primary hover:bg-secondary dark:hover:bg-secondary-container transition-colors duration-200 p-sm border-2 border-transparent hover:border-on-surface scale-95 active:bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content: Levels Grid -->
<main class="flex-grow p-grid-margin mb-20">
<div class="mb-lg border-b-2 border-on-surface pb-sm flex justify-between items-end">
<h2 class="font-headline-lg text-headline-lg text-on-surface uppercase tracking-tight">LEVELS</h2>
<span class="font-label-md text-label-md text-on-surface-variant">WORLD 1: FOUNDATION</span>
</div>
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-0 border-2 border-on-surface border-b-0 border-r-0">
<!-- Level 1: Completed (Primary Red) -->
<button class="aspect-square border-r-2 border-b-2 border-on-surface bg-primary text-on-primary flex flex-col justify-between p-sm relative hover:bg-primary-container transition-colors group">
<span class="font-headline-md text-headline-md absolute top-sm left-sm leading-none">01</span>
<div class="flex justify-end items-end h-full w-full">
<!-- 3 Stars/Dots -->
<div class="flex gap-1">
<div class="w-2 h-2 bg-on-primary border border-on-surface"></div>
<div class="w-2 h-2 bg-on-primary border border-on-surface"></div>
<div class="w-2 h-2 bg-on-primary border border-on-surface"></div>
</div>
</div>
</button>
<!-- Level 2: Completed (Secondary Yellow) -->
<button class="aspect-square border-r-2 border-b-2 border-on-surface bg-secondary-container text-on-secondary-container flex flex-col justify-between p-sm relative hover:bg-secondary transition-colors group">
<span class="font-headline-md text-headline-md absolute top-sm left-sm leading-none">02</span>
<div class="flex justify-end items-end h-full w-full">
<div class="flex gap-1">
<div class="w-2 h-2 bg-on-surface border border-on-surface"></div>
<div class="w-2 h-2 bg-on-surface border border-on-surface"></div>
<div class="w-2 h-2 bg-transparent border border-on-surface"></div>
</div>
</div>
</button>
<!-- Level 3: Completed (Tertiary Blue) -->
<button class="aspect-square border-r-2 border-b-2 border-on-surface bg-tertiary text-on-tertiary flex flex-col justify-between p-sm relative hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors group">
<span class="font-headline-md text-headline-md absolute top-sm left-sm leading-none">03</span>
<div class="flex justify-end items-end h-full w-full">
<div class="flex gap-1">
<div class="w-2 h-2 bg-on-tertiary border border-on-surface"></div>
<div class="w-2 h-2 bg-transparent border border-on-surface"></div>
<div class="w-2 h-2 bg-transparent border border-on-surface"></div>
</div>
</div>
</button>
<!-- Level 4: Current (White with solid border) -->
<button class="aspect-square border-r-2 border-b-2 border-on-surface bg-surface text-on-surface flex flex-col justify-between p-sm relative hover:bg-surface-variant transition-colors group ring-4 ring-inset ring-primary">
<span class="font-headline-md text-headline-md absolute top-sm left-sm leading-none">04</span>
<div class="flex justify-center items-center absolute inset-0">
<span class="material-symbols-outlined text-headline-lg opacity-50" data-icon="play_arrow">play_arrow</span>
</div>
<div class="flex justify-end items-end h-full w-full z-10">
<div class="flex gap-1">
<div class="w-2 h-2 bg-transparent border border-on-surface"></div>
<div class="w-2 h-2 bg-transparent border border-on-surface"></div>
<div class="w-2 h-2 bg-transparent border border-on-surface"></div>
</div>
</div>
</button>
<!-- Levels 5-20: Locked -->
<script>
                for(let i=5; i<=20; i++) {
                    const levelNum = i < 10 ? '0' + i : i;
                    document.write(`
                    <div class="aspect-square border-r-2 border-b-2 border-on-surface bg-surface-variant text-on-surface-variant flex flex-col justify-between p-sm relative opacity-60">
                        <span class="font-headline-md text-headline-md absolute top-sm left-sm leading-none">${levelNum}</span>
                        <div class="flex justify-center items-center h-full w-full">
                             <span class="material-symbols-outlined" data-icon="lock">lock</span>
                        </div>
                    </div>
                    `);
                }
            </script>
</div>
</main>
<!-- BottomNavBar Component -->
<nav class="bg-surface dark:bg-inverse-surface border-t-2 border-on-surface-variant dark:border-on-surface fixed bottom-0 left-0 w-full z-50 flex justify-around items-stretch h-20 md:hidden">
<!-- PLAY (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant h-full w-full hover:bg-secondary-fixed dark:hover:bg-secondary-fixed-dim border-r-2 border-on-surface-variant" href="#">
<span class="material-symbols-outlined mb-1" data-icon="play_arrow">play_arrow</span>
<span class="font-label-md text-label-md uppercase">PLAY</span>
</a>
<!-- LEVELS (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary dark:bg-secondary-container text-on-secondary dark:text-on-secondary-container h-full w-full border-r-2 border-on-surface-variant" href="#">
<span class="material-symbols-outlined mb-1" data-icon="grid_view" data-weight="fill" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="font-label-md text-label-md uppercase">LEVELS</span>
</a>
<!-- STATS (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant h-full w-full hover:bg-secondary-fixed dark:hover:bg-secondary-fixed-dim" href="#">
<span class="material-symbols-outlined mb-1" data-icon="leaderboard">leaderboard</span>
<span class="font-label-md text-label-md uppercase">STATS</span>
</a>
</nav>
<!-- Desktop Sidebar (Hidden on mobile, replaces bottom nav) -->
<aside class="hidden md:flex flex-col w-64 border-r-2 border-on-surface bg-surface fixed left-0 top-16 bottom-0 z-30">
<div class="p-lg flex flex-col gap-sm">
<a class="flex items-center gap-md p-sm text-on-surface-variant hover:bg-secondary hover:text-on-secondary border-2 border-transparent hover:border-on-surface transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
<span class="font-label-md text-label-md uppercase">PLAY</span>
</a>
<a class="flex items-center gap-md p-sm bg-secondary text-on-secondary border-2 border-on-surface" href="#">
<span class="material-symbols-outlined" data-icon="grid_view" data-weight="fill" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="font-label-md text-label-md uppercase">LEVELS</span>
</a>
<a class="flex items-center gap-md p-sm text-on-surface-variant hover:bg-secondary hover:text-on-secondary border-2 border-transparent hover:border-on-surface transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-label-md text-label-md uppercase">STATS</span>
</a>
</div>
</aside>
<!-- Adjust main content margin for desktop sidebar -->
<style>
        @media (min-width: 768px) {
            main {
                margin-left: 16rem; /* 64 * 0.25rem = 16rem */
                margin-bottom: 0;
            }
        }
    </style>
</body></html>
